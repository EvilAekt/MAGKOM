name: MagKom CI Quality Gate & Security Audit

on:
  push:
    branches: [ main, master, test-1, test-2 ]
  pull_request:
    branches: [ main, master, test-2 ]
  workflow_dispatch:
    inputs:
      run_strix_scan:
        description: "Jalankan Strix AI Security Scan (membutuhkan STRIX_TARGET_URL dan STRIX_API_TOKEN)"
        required: false
        type: boolean
        default: false
  schedule:
    # Jadwal mingguan: Setiap Senin pukul 03:00 UTC (10:00 WIB)
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/test-2' }}

permissions:
  contents: read

jobs:
  quality-gate:
    name: PHP 8.3 Quality Gate & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, sqlite3, fileinfo, gd, curl, zip, bcmath
          coverage: none

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Check Platform Requirements (PHP 8.3)
        run: composer check-platform-reqs

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Vite Assets
        run: |
          npm ci
          npm run build

      - name: Run Laravel Pint Code Style Linter
        run: ./vendor/bin/pint --test

      - name: Run Larastan / PHPStan Static Analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Run Feature & Unit Tests (SQLite :memory:)
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/1SeSgqqN7DVBhhY+GwYqS1nvg=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  frontend-quality:
    name: Frontend Quality & Asset Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies (Clean Install)
        run: npm ci

      - name: Audit NPM Dependencies
        run: npm audit --audit-level=high

      - name: Build Vite Production Assets
        run: npm run build

  dependency-audit:
    name: Dependency Security Audit (Composer & NPM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Composer Dependency Security Audit
        run: composer audit --format=table --abandoned=ignore
        continue-on-error: true

      - name: Run NPM Dependency Security Audit
        run: npm audit --audit-level=high

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  php-security-analysis:
    name: PHP & Laravel Static Security Analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep Security Scanner
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
            --config "p/php" \
            --config "p/owasp-top-ten" \
            --config "p/security-audit" \
            --sarif --output semgrep.sarif \
            --error

      - name: Upload Semgrep SARIF Security Report
        uses: github/codeql-action/upload-sarif@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php

  workflow-security-audit:
    name: Workflow Security & Linter Audit (actionlint & zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -version

      - name: Lint GitHub Actions Workflows (actionlint)
        run: ./actionlint -color

      - name: Setup Python for zizmor
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install & Run zizmor Security Audit
        run: |
          pip install zizmor
          zizmor .github/workflows/

  application-security-tests:
    name: Laravel In-Tree Security Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, sqlite3, fileinfo, gd, curl, zip, bcmath
          coverage: none

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Install Application Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Vite Assets
        run: |
          npm ci
          npm run build

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Execute RBAC, IDOR, Document & Rate Limiting Security Suites
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/1SeSgqqN7DVBhhY+GwYqS1nvg=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test tests/Feature/SecurityDocumentVerificationAuditTest.php tests/Feature/SecuritySuperAdminAccessControlTest.php tests/Feature/SecurityRateLimitingAndBruteForceTest.php tests/Feature/SecurityDeepDefensePenetrationTest.php tests/Feature/SecurityTxtEndpointTest.php tests/Feature/PembimbingIdorProtectionTest.php

  mysql-integration-tests:
    name: MySQL 8 Database Concurrency & Quota Locking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: magkom_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # 2.32.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, fileinfo, gd, curl, zip, bcmath
          coverage: none

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Install Application Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Run Migrations and Atomic Quota Locking Tests on MySQL 8
        env:
          APP_ENV: testing
          APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/1SeSgqqN7DVBhhY+GwYqS1nvg=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: magkom_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          php artisan test tests/Feature/QuotaConcurrencyTest.php

  codeql-javascript-actions:
    name: CodeQL Analysis (JavaScript & GitHub Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          languages: javascript-typescript, actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6bb031afdd8eb862ea3fc1848194185e076637e5 # v3.28.11
        with:
          category: codeql-js-actions

  strix-security-audit:
    name: Strix AI Security Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.repository == 'EvilAekt/MAGKOM' && !github.event.pull_request.head.repo.fork

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python for Strix Verifier
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Execute Strix Cloud Security Verification Gate
        env:
          STRIX_API_TOKEN: ${{ secrets.STRIX_API_TOKEN }}
          STRIX_TARGET_URL: ${{ secrets.STRIX_TARGET_URL }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_strix_scan == 'true' }}
        run: |
          python -c "
          import os, sys, urllib.request, json
          token = os.environ.get('STRIX_API_TOKEN')
          target_url = os.environ.get('STRIX_TARGET_URL')
          is_dispatch = os.environ.get('IS_DISPATCH') == 'True'
          
          if not token:
              print('[INFO] STRIX_API_TOKEN secret belum dikonfigurasi di GitHub Repository Secrets.')
              print('[INFO] Pengujian keamanan in-tree (Pest/PHPUnit, Semgrep SAST, Gitleaks, dan CodeQL) tetap melindungi sistem secara penuh.')
              sys.exit(0)
          
          print('[INFO] Memverifikasi autentikasi token Strix Cloud API...')
          req = urllib.request.Request('https://app.strix.ai/api/v1/scans?limit=1', headers={'Authorization': f'Bearer {token}'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  total = data.get('meta', {}).get('total_items', 0)
                  print(f'[SUCCESS] Terhubung ke Strix Cloud API. Total scan historis terdaftar: {total}.')
          except urllib.error.HTTPError as e:
              print(f'[WARN] Autentikasi Strix API mengembalikan HTTP {e.code}: {e.reason}')
              sys.exit(0)
          except Exception as e:
              print(f'[WARN] Gagal menghubungi endpoint Strix Cloud API: {e}')
              sys.exit(0)

          print('[INFO] CATATAN AUDIT: Pemanggilan GET /api/v1/scans adalah verifikasi konektivitas token API, BUKAN bukti pemindaian penetrasi aktif baru.')
          
          if not target_url:
              print('[INFO] STRIX_TARGET_URL tidak disetel. Active penetration test eksternal dilewati untuk mencegah pemindaian tidak terencana ke lingkungan produksi.')
              print('[INFO] Untuk menjalankan pemindaian DAST aktif pada environment staging, setel secret STRIX_TARGET_URL dan picu melalui workflow_dispatch.')
          else:
              print(f'[INFO] Target staging terkonfigurasi pada: {target_url}.')
              if is_dispatch:
                  print('[INFO] Trigger manual workflow_dispatch terdeteksi. Memulai persiapan scan...')
              else:
                  print('[INFO] Push/PR rutin: Melewati active attack DAST demi stabilitas runner. Gunakan workflow_dispatch untuk deep scan.')
          "
