version: 2
updates:
  # 1. Pemantauan & Pembaruan Dependensi GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "area:devops"
      - "maintenance"
    commit-message:
      prefix: "build(ci)"
      include: "scope"

  # 2. Pemantauan & Pembaruan Dependensi Backend (Composer)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "area:backend"
      - "maintenance"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Mengelompokkan update non-breaking dan fokus pada security patch
    groups:
      composer-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # 3. Pemantauan & Pembaruan Dependensi Frontend (NPM)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "area:frontend"
      - "maintenance"
    commit-message:
      prefix: "chore(deps-dev)"
      include: "scope"
    # Mengelompokkan update patch/minor frontend
    groups:
      npm-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

