# ==============================================================================
# MAGKOM — Nginx Production Performance Optimization Snippet
# Directive: PERF-P2-04 (Gzip Compression & Immutable Static Asset Caching)
# Target Environment: Production & Staging Nginx Web Servers
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Gzip Dynamic & Static Compression
# ------------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024; # Hanya kompres respon > 1 KB (menghindari overhead kompresi paket kecil)
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# ------------------------------------------------------------------------------
# 2. Immutable Cache untuk Asset Build Vite (/build/assets/)
# Aset Vite memiliki hash unik pada filename (misal: app-Bq77PD77.css).
# Aman di-cache selama 1 tahun (immutable).
# ------------------------------------------------------------------------------
location /build/assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always; # Mitigasi RSK-04
    access_log off;
    try_files $uri =404;
}

# ------------------------------------------------------------------------------
# 3. Cache Aset Statis Publik (Gambar, Font, Favicon)
# Logo Sleman (/images/logo-sleman.png), Favicon, dan Web Fonts
# ------------------------------------------------------------------------------
location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff" always; # Mitigasi RSK-04
    access_log off;
    try_files $uri =404;
}

# ------------------------------------------------------------------------------
# 4. Anti-Buffer untuk Server-Sent Events (SSE Realtime)
# Mencegah Nginx menahan chunk SSE sehingga update instan diterima klien.
# ------------------------------------------------------------------------------
location /realtime/ {
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_buffering off;
    proxy_cache off;
    fastcgi_buffering off;
    fastcgi_read_timeout 60s;
}

